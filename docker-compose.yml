version: "3.9"

services:

  # ── MongoDB ──────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: sis_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: store_intelligence
    networks:
      - sis_net

  # ── Zookeeper (Kafka dependency) ─────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sis_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sis_net

  # ── Apache Kafka ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sis_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - sis_net

  # ── Kafka UI (optional but useful) ──────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sis_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - sis_net

  # ── Redis (caching) ──────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: sis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sis_net

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sis_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - kafka
      - redis
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - APP_ENV=production
    volumes:
      - ./sample_data:/app/sample_data:ro
    networks:
      - sis_net

  # ── CV Pipeline ──────────────────────────────────────────
  cv_pipeline:
    build:
      context: ./cv_pipeline
      dockerfile: Dockerfile
    container_name: sis_cv_pipeline
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - STORE_ID=store_1
    volumes:
      - ./sample_data:/app/sample_data:ro
    networks:
      - sis_net

  # ── Event Streaming Simulator ────────────────────────────
  event_producer:
    build:
      context: ./streaming
      dockerfile: Dockerfile
    container_name: sis_event_producer
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./sample_data:/app/sample_data:ro
    networks:
      - sis_net

  # ── Anomaly Detection Service ────────────────────────────
  anomaly_detection:
    build:
      context: ./anomaly_detection
      dockerfile: Dockerfile
    container_name: sis_anomaly
    restart: unless-stopped
    depends_on:
      - kafka
      - mongodb
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MONGODB_URL=mongodb://mongodb:27017
    networks:
      - sis_net

  # ── React Dashboard ──────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sis_dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sis_net

volumes:
  mongo_data:

networks:
  sis_net:
    driver: bridge
